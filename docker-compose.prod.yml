# Surcharge pour le serveur (préproduction et production) — utilisée avec docker-compose.yml :
#   docker compose -p exam1-prod    --env-file .env.prod    -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#   docker compose -p exam1-preprod --env-file .env.preprod -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Aucun port n'est publié sur l'hôte : seul le reverse proxy Caddy (HTTPS) joint le frontend et l'API
# via un réseau Docker DÉDIÉ (exam1-proxy) : les conteneurs exam1 ne voient aucun autre service du serveur.
# Limites mémoire/CPU : une surcharge d'exam1 ne peut pas pénaliser les autres sites hébergés.

# Rotation des journaux Docker : 3 fichiers de 10 Mo max par conteneur (le disque du serveur ne peut pas saturer)
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  mongo:
    logging: *logging
    mem_limit: 512m
    cpus: 0.5
    ports: !reset []
    # Limite la mémoire de MongoDB (serveur partagé)
    command: ['--wiredTigerCacheSizeGB', '0.25']

  backend:
    logging: *logging
    mem_limit: 256m
    cpus: 0.5
    ports: !reset []
    environment:
      TRUST_PROXY: 1
    networks:
      default: {}
      proxy:
        aliases: ['${STACK_NAME:?STACK_NAME manquant}-backend']

  frontend:
    logging: *logging
    mem_limit: 64m
    cpus: 0.25
    ports: !reset []
    networks:
      default: {}
      proxy:
        aliases: ['${STACK_NAME:?STACK_NAME manquant}-frontend']

  gateway:
    logging: *logging
    mem_limit: 128m
    cpus: 0.25

  notifications:
    logging: *logging
    mem_limit: 128m
    cpus: 0.25

  stock-management:
    logging: *logging
    mem_limit: 96m
    cpus: 0.25

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-exam1-proxy}
